server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Estáticos con hash en el nombre (outputHashing: "all"): cacheables
    # de forma agresiva, un despliegue nuevo cambia el nombre del fichero.
    location ~* \.(?:js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Angular Router en modo history: cualquier ruta que no sea un fichero
    # real cae en index.html para que el router del lado cliente decida.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
