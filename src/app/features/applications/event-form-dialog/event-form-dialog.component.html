<h2 mat-dialog-title>{{ 'event_form.title' | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="event-form">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'event_form.type' | translate }}</mat-label>
      <mat-select formControlName="type">
        @for (t of types; track t) {
          <mat-option [value]="t">{{ 'event_type.' + t | translate }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'event_form.event_date' | translate }}</mat-label>
      <input matInput [matDatepicker]="eventDatePicker" formControlName="event_date" />
      <mat-datepicker-toggle matIconSuffix [for]="eventDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #eventDatePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'event_form.description' | translate }}</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        {{ 'event_form.submit' | translate }}
      }
    </button>
  </mat-dialog-actions>
</form>
